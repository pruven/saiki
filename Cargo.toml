[package]
name = "saiki"
version = "0.7.1"
edition = "2024"
description = "On-screen keypresses and keyboard shortcuts for Wayland and Windows"
license = "MIT"

[dependencies]
anyhow = "1"
async-channel = "2"
futures-lite = "2"
semver = "1"
serde_json = "1"
ureq = { version = "3.5", default-features = false, features = ["native-tls-no-default"] }

[target.'cfg(target_os = "linux")'.dependencies]
async-io = "2"
async-process = "2"
gpui = { package = "gpui-unofficial", version = "=1.29.3", default-features = false, features = ["wayland"] }
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "=1.29.3", default-features = false, features = ["wayland", "font-kit"] }
input = "0.10"
ksni = { version = "0.3.7", default-features = false, features = ["async-io"] }
libc = "0.2"
wayland-client = "0.31"
xkbcommon = "0.9"
zbus = "5"

[target.'cfg(target_os = "windows")'.dependencies]
gpui = { package = "gpui-unofficial", version = "=1.29.3", default-features = false }
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "=1.29.3", default-features = false }
raw-window-handle = "0.6"
windows = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Security", "Win32_System_LibraryLoader",
    "Win32_System_Threading", "Win32_System_Console", "Win32_System_RemoteDesktop",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell", "Win32_System_StationsAndDesktops",
    "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_HiDpi",
] }

[profile.dev]
debug = 0

[patch.crates-io]
# Wayland needs matching size limits for non-resizable windows to float by default.
gpui-linux-gpui-unofficial = { path = "vendor/gpui-linux" }
