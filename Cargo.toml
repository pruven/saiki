[package]
name = "saiki"
version = "0.4.0"
edition = "2024"
description = "On-screen keypresses and keyboard shortcuts for Wayland"
license = "MIT"

[dependencies]
anyhow = "1"
async-channel = "2"
async-io = "2"
async-process = "2"
futures-lite = "2"
gpui = { package = "gpui-unofficial", version = "=1.29.3", default-features = false, features = ["wayland"] }
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "=1.29.3", default-features = false, features = ["wayland", "font-kit"] }
input = "0.10"
ksni = { version = "0.3.7", default-features = false, features = ["async-io"] }
libc = "0.2"
serde_json = "1"
wayland-client = "0.31"
xkbcommon = "0.9"
zbus = "5"

[profile.dev]
debug = 0
