name: Build and release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check release versions
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import tomllib

          cargo_version = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
          pkgbuild_version = re.search(r"^pkgver=(\S+)$", Path("pkgbuild/PKGBUILD").read_text(), re.M)
          lock_version = next(package["version"] for package in tomllib.loads(Path("Cargo.lock").read_text())["package"] if package["name"] == "saiki")
          if lock_version != cargo_version:
              raise SystemExit("Cargo.toml and Cargo.lock versions must match")
          if not pkgbuild_version or pkgbuild_version[1] != cargo_version:
              raise SystemExit("Cargo.toml and PKGBUILD versions must match")
          if os.environ["GITHUB_REF_TYPE"] == "tag" and os.environ["GITHUB_REF_NAME"] != f"v{cargo_version}":
              raise SystemExit(f"Expected release tag v{cargo_version}")
          PY

  build:
    needs: validate
    name: Arch Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            image: archlinux:base-devel
            vulkan_driver: vulkan-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Test and build the Arch Linux package
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
          BUILD_IMAGE: ${{ matrix.image }}
          VULKAN_DRIVER: ${{ matrix.vulkan_driver }}
        run: |
          mkdir -p "$RUNNER_TEMP/saiki-release"
          docker run --rm \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/source,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/saiki-release,dst=/release" \
            --env PACKAGE_ARCH \
            --env VULKAN_DRIVER \
            "$BUILD_IMAGE" bash -euo pipefail -c '
              test "$(uname -m)" = "$PACKAGE_ARCH"
              pacman -Syu --noconfirm --needed rust pkgconf wayland "$VULKAN_DRIVER" \
                libinput libxkbcommon-x11 libxcb fontconfig freetype2 ttf-liberation openssl ca-certificates
              useradd --create-home builder
              mkdir /build
              cp -a /source/. /build/
              chown -R builder:builder /build
              cd /build
              runuser -u builder -- env JOBS=2 ./bin/test
              cd pkgbuild
              runuser -u builder -- env JOBS=2 makepkg --noconfirm
              install -m644 saiki-*-"$PACKAGE_ARCH".pkg.tar.zst /release/
            '
          cd "$RUNNER_TEMP/saiki-release"
          sha256sum saiki-*-"$PACKAGE_ARCH".pkg.tar.zst > "SHA256SUMS-linux-$PACKAGE_ARCH"

      - uses: actions/upload-artifact@v6
        with:
          name: saiki-arch-${{ matrix.arch }}
          path: ${{ runner.temp }}/saiki-release/
          if-no-files-found: error
          compression-level: 0

  linux:
    needs: validate
    name: Linux archive (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libinput-dev libudev-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libfontconfig1-dev libfreetype-dev libssl-dev xkb-data
          rustup update stable
      - name: Test and package
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$PACKAGE_ARCH"
          ./bin/test
          ./bin/build
          ./build/saiki --version
          archive="saiki-linux-$PACKAGE_ARCH"
          mkdir -p "release/$archive"
          install -m755 build/saiki "release/$archive/saiki"
          install -m644 README.md LICENSE "release/$archive/"
          cd release
          tar -czf "$archive.tar.gz" "$archive"
          sha256sum "$archive.tar.gz" > "SHA256SUMS-archive-linux-$PACKAGE_ARCH"
      - uses: actions/upload-artifact@v6
        with:
          name: saiki-linux-${{ matrix.arch }}
          path: |
            release/*.tar.gz
            release/SHA256SUMS-archive-linux-*
          if-no-files-found: error
          compression-level: 0

  windows:
    needs: validate
    name: Windows (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Test
        run: ./bin/test.ps1 -Target ${{ matrix.target }}
      - name: Build
        run: ./bin/build.ps1 -Target ${{ matrix.target }}
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $archive = "saiki-windows-${{ matrix.arch }}.zip"
          Compress-Archive -Path build/saiki.exe, README.md, LICENSE -DestinationPath "release/$archive"
          $hash = (Get-FileHash "release/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content release/SHA256SUMS-windows-${{ matrix.arch }} -Encoding ascii
      - uses: actions/upload-artifact@v6
        with:
          name: saiki-windows-${{ matrix.arch }}
          path: release/
          if-no-files-found: error
          compression-level: 0

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: saiki-*
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # PowerShell writes CRLF. Normalize the manifest before checking or reading filenames.
          sed 's/\r$//' SHA256SUMS-linux-x86_64 SHA256SUMS-archive-linux-{x86_64,aarch64} \
            SHA256SUMS-windows-{x86_64,arm64} > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          mapfile -t packages < <(cut -d ' ' -f 3 SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" --json assets,isDraft > existing-release.json 2>/dev/null; then
            gh release upload "$GITHUB_REF_NAME" "${packages[@]}" SHA256SUMS --clobber
            gh release view "$GITHUB_REF_NAME" --json assets,isDraft > existing-release.json
            jq -e '
              [.assets[].name] as $assets |
              .isDraft == false and
              ($ARGS.positional | all(. as $name | $assets | index($name) != null))
            ' existing-release.json --args "${packages[@]}" SHA256SUMS > /dev/null
          else
            gh release create "$GITHUB_REF_NAME" "${packages[@]}" SHA256SUMS \
              --verify-tag --title "Saiki $GITHUB_REF_NAME" --generate-notes
          fi
